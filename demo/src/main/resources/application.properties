spring.application.name=ElectroMart
server.port=8080

# H2 in-memory database for local development; can be replaced with MySQL in prod
spring.datasource.url=jdbc:h2:mem:electromart;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=electromart-super-secret-key-change-me
app.jwt.expiration-ms=86400000
app.initial-admin-email=admin@electromart.com
app.initial-admin-password=Admin@123
app.cors.allowed-origins=http://localhost:5173

spring.jackson.serialization.write-dates-as-timestamps=false
